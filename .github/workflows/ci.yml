name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agents/it-admin/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r agents/it-admin/requirements.txt \
            pytest pytest-asyncio httpx

      - name: Run agent tests
        run: python -m pytest agents/it-admin/tests -q

      - name: Check shell syntax
        run: bash -n scripts/*.sh scripts/tests/*.sh

      - name: Check Python script syntax
        run: python -m py_compile scripts/prepdocs-search-only.py

      - name: Test deployment preflight
        run: bash scripts/tests/preflight-check.test.sh

      - name: Compile Bicep
        run: |
          az bicep install --version v0.46.1
          az bicep build --file infra/main.bicep \
            --outfile "$RUNNER_TEMP/main.json" \
            2>"$RUNNER_TEMP/bicep.log"
          cat "$RUNNER_TEMP/bicep.log"
          test ! -s "$RUNNER_TEMP/bicep.log"